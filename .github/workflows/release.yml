name: Release

# 署名付き Velopack リリース (PerMachine MSI) を GitHub Actions で作り、R2 (lumin4ti.kagayoi.com) へ配信する。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。vpk の署名に加え、Program Files 補正後の MSI 再署名も同じ経路で行う。
#   署名者の CN はアプリの実行時検証 (WindowsPerMachineMigration.ExpectedPublisher) と同じ証明書のまま変わらない。
# - 起動: 手動 (workflow_dispatch)。/vava で版を上げて push した後に、リリースしたいブランチを指定して実行する。
#   誤配信を避けるため push / tag では自動起動しない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# - WiX は vpk に同梱されているため、ランナーへの追加導入は不要。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す (出力はリポジトリ内 local-release/)。
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名・検証だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # global.json が無いため既存の dependency-validation.yml と同じ指定にする。
          dotnet-version: 11.0.x

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lumin4ti-release-packages
          path: local-release/artifacts/*
          if-no-files-found: warn
          retention-days: 7
