name: Release

# 署名付き Velopack リリース (PerMachine MSI) を GitHub Actions で作り、R2 (lumin4ti.kagayoi.com) へ配信する。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。vpk の署名に加え、Program Files 補正後の MSI 再署名も同じ経路で行う。
#   署名者の CN はアプリの実行時検証 (WindowsPerMachineMigration.ExpectedPublisher) と同じ証明書のまま変わらない。
# - 起動: main のコミットに付けた軽量タグ v<x.y.z> の push (/vava が版を上げた main へタグを付けて push すると始まる)。
#   手動実行 (workflow_dispatch) は、同じタグを指定した再実行にだけ使う (gh workflow run release.yml --ref v<x.y.z>)。
#   guard ジョブが、タグであること・厳密な版タグの形・軽量タグで同じ commit・既定ブランチの祖先・版ファイルとの一致を確かめる。
#   Environment "release" は tag ポリシー v[0-9]*.[0-9]*.[0-9]* だけを許可する。GitHub Release は作らない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# - WiX は vpk に同梱されているため、ランナーへの追加導入は不要。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す (出力はリポジトリ内 local-release/)。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名・検証だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  # 配信の入口検査。Environment も Secrets も持たない。タグ以外・版が合わないタグ・main の祖先でないタグはここで止める。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では配信しない: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグの形ではない: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          version="${GITHUB_REF_NAME#v}"
          # 軽量タグで、いまもこの commit を指すこと
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグが $GITHUB_SHA を指す軽量タグではない"; exit 1; }
          # 既定ブランチの祖先であること (depth=1 の checkout では判定できないので compare API を使う)
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status+" "+(.behind_by|tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではない ($cmp)"; exit 1; }
          # 版ファイルとの一致
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/Directory.Build.props?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' | head -1)"
          [[ "$file" == "$version" ]] || { echo "::error::版ファイルの版 $file とタグの版 $version が違う"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # 署名・配信の前に既存の回帰テストを通す。失敗したら release ジョブは始まらない (Environment の Secrets にも触れない)。
  # 手順は dependency-validation.yml と同じ (R2 転送の fixture 検証、restore、Release build、dotnet test)。
  test:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: R2 転送の fixture を検証
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: |
          dotnet restore Lumin4ti.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          dotnet build Lumin4ti.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 回帰テストを実行
        run: |
          dotnet test Lumin4ti.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    needs: [guard, test]
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # global.json が無いため既存の dependency-validation.yml と同じ指定にする。
          dotnet-version: 11.0.x

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lumin4ti-release-packages
          path: local-release/artifacts/*
          if-no-files-found: warn
          retention-days: 7
