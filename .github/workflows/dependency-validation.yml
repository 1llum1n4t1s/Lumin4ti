name: Dependency validation

# 通常の変更 (main への push と全 PR) でもテストを走らせる。Dependabot 限定にしない。
# 署名・配信が要る検証 (release.yml) と実機操作が要る確認はここに含めない。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-
            ${{ runner.os }}-nuget-
      - name: Restore
        run: |
          dotnet restore Lumin4ti.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - name: Build
        run: |
          dotnet build Lumin4ti.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test Lumin4ti.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
